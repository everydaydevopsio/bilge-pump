name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build all apps by calling the reusable workflow
  build-dev-cache:
    name: Build dev-cache
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: dev-cache
      go_version: '1.22'

  build-git-cleaner:
    name: Build git-cleaner
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: git-cleaner
      go_version: '1.22'

  build-bilge-macos:
    name: Build bilge-macos
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: bilge-macos
      go_version: '1.22'

  build-unified-cli:
    name: Build unified CLI and platform cleaners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - name: Format check
        run: |
          test -z "$(gofmt -l cmd)"
      - name: Test unified CLI and platform cleaners
        run: go test ./cmd/...
      - name: Test MCP stdio transport with built commands
        run: |
          make bilge
          python3 scripts/test-mcp.py build/bilge
      - name: Cross-build unified and platform commands
        run: |
          set -eu
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -o /tmp/bilge ./cmd/bilge
            done
          done
          for os in linux windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -o /tmp/platform-cleaner ./cmd/platform-bilge
            done
          done

  test-windows-batch-launcher:
    name: Test Windows batch command arguments
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - name: Test native batch argument handling
        run: go test ./cmd/platform-bilge

  test-dev-cache-windows:
    name: Test dev-cache native Windows filters
    runs-on: windows-latest
    defaults:
      run:
        working-directory: dev-cache
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: dev-cache/go.sum
      - name: Test native Windows path filters and cleanup
        run: go test ./...

  test-macos-task-json:
    name: Test macOS task JSON integration
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - name: Test structured macOS task output
        run: go test ./cmd/bilge -run '^TestMacCleanerJSONIsStructured$'

  test-unix-installer:
    name: Test Unix installer selections
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Test unified and standalone installs
        run: sh scripts/test-install.sh
