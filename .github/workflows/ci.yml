name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build all apps by calling the reusable workflow
  build-dev-cache:
    name: Build dev-cache
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: dev-cache
      go_version: '1.22'

  build-git-cleaner:
    name: Build git-cleaner
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: git-cleaner
      go_version: '1.22'

  build-mac-cache-cleaner:
    name: Build mac-cache-cleaner
    uses: ./.github/workflows/build-app.yml
    with:
      app_name: mac-cache-cleaner
      go_version: '1.22'

  build-unified-cli:
    name: Build unified CLI and platform cleaners
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      - name: Format check
        run: |
          test -z "$(gofmt -l cmd)"
      - name: Cross-build unified and platform commands
        run: |
          set -eu
          for os in darwin linux windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -o /tmp/cache-cleaner ./cmd/cache-cleaner
            done
          done
          for os in linux windows; do
            for arch in amd64 arm64; do
              GOOS="$os" GOARCH="$arch" go build -o /tmp/platform-cleaner ./cmd/platform-cache-cleaner
            done
          done
